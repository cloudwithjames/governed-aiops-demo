database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
model:
  default: glm-5.2
  provider: huawei_maas
  base_url: ''
kanban:
  review_dispatch: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  protect_first_n: 3
  idle_compact_after_seconds: 0
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
prompt_caching:
  cache_ttl: 5m
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
max_concurrent_sessions: null
group_sessions_per_user: true
streaming:
  enabled: true
  transport: auto
skills:
  creation_nudge_interval: 15
agent:
  max_turns: 500
  verbose: false
  reasoning_effort: medium
  reasoning_overrides: {}
  personalities: {}
mcp_servers:
  governed_aiops:
    url: "http://ops-mcp:8765/mcp"
    enabled: true
    timeout: 120
    connect_timeout: 30
    tools:
      include:
        - check_portal
        - check_backend
        - get_gateway_logs
        - get_gateway_config
        - get_recent_changes
        - apply_gateway_fix
        - verify_service
platform_toolsets:
  cli:
    - hermes-cli
stt:
  enabled: false
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 50
display:
  compact: false
  tool_progress: all
  cleanup_progress: false
  interim_assistant_messages: true
  long_running_notifications: true
  busy_ack_detail: true
  busy_input_mode: interrupt
  background_process_notifications: all
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
providers:
  huawei_maas:
    name: huawei_maas
    base_url: https://api-ap-southeast-1.modelarts-maas.com/openai/v1
    key_env: OPENAI_API_KEY
    default_model: glm-5.2
    api_mode: chat_completions
onboarding:
  seen:
    busy_input_prompt: true
