services:
  demo-backend:
    build: ./demo-backend
    container_name: demo-backend
    networks: [aiops-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  demo-gateway:
    build: ./demo-gateway
    container_name: demo-gateway
    networks: [aiops-net]
    depends_on:
      demo-backend:
        condition: service_healthy
    environment:
      - DEMO_ADMIN_TOKEN=${DEMO_ADMIN_TOKEN}
      - NORMAL_BACKEND_URL=${NORMAL_BACKEND_URL}
      - FAULT_BACKEND_URL=${FAULT_BACKEND_URL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  aiops-api:
    build: ./api
    container_name: aiops-api
    networks: [aiops-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      demo-gateway:
        condition: service_healthy
    volumes:
      - aiops-data:/data
    environment:
      - AIOPS_AGENT_MODE=${AIOPS_AGENT_MODE}
      - AIOPS_DB_PATH=/data/aiops.db
      - AIOPS_INTERNAL_TOKEN=${AIOPS_INTERNAL_TOKEN}
      - DEMO_ADMIN_TOKEN=${DEMO_ADMIN_TOKEN}
      - APPROVAL_SIGNING_SECRET=${APPROVAL_SIGNING_SECRET}
      - APPROVAL_TTL_SECONDS=${APPROVAL_TTL_SECONDS}
      - DEMO_APPROVER_NAME=${DEMO_APPROVER_NAME}
      - HERMES_API_URL=${HERMES_API_URL}
      - HERMES_API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      - HERMES_MODEL_NAME=${HERMES_MODEL_NAME}
      - OPS_MCP_URL=${OPS_MCP_URL}
      - DEMO_GATEWAY_URL=${DEMO_GATEWAY_URL}
      - DEMO_BACKEND_URL=${DEMO_BACKEND_URL}
      - NORMAL_BACKEND_URL=${NORMAL_BACKEND_URL}
      - FAULT_BACKEND_URL=${FAULT_BACKEND_URL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ops-mcp:
    build: ./ops-mcp
    container_name: ops-mcp
    networks: [aiops-net]
    depends_on:
      aiops-api:
        condition: service_healthy
      demo-gateway:
        condition: service_healthy
    environment:
      - DEMO_GATEWAY_URL=${DEMO_GATEWAY_URL}
      - DEMO_BACKEND_URL=${DEMO_BACKEND_URL}
      - NORMAL_BACKEND_URL=${NORMAL_BACKEND_URL}
      - FAULT_BACKEND_URL=${FAULT_BACKEND_URL}
      - DEMO_ADMIN_TOKEN=${DEMO_ADMIN_TOKEN}
      - AIOPS_INTERNAL_TOKEN=${AIOPS_INTERNAL_TOKEN}
      - AIOPS_API_URL=http://aiops-api:8000
      - APPROVAL_SIGNING_SECRET=${APPROVAL_SIGNING_SECRET}
      - APPROVAL_TTL_SECONDS=${APPROVAL_TTL_SECONDS}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: aiops-hermes
    command: gateway run
    networks: [aiops-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ops-mcp:
        condition: service_healthy
    volumes:
      - hermes-data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/skills:/app/skills:ro
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      - OPENAI_API_KEY=${HERMES_MODEL_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8642)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  aiops-ui:
    build: ./ui
    container_name: aiops-ui
    networks: [aiops-net]
    depends_on:
      aiops-api:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    restart: unless-stopped

networks:
  aiops-net:
    driver: bridge

volumes:
  aiops-data:
  hermes-data:
