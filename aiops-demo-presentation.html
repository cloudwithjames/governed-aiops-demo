<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huawei Cloud Governed AI Ops Demo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1628;--bg2:#0f1f3a;--bg3:#162447;--bg4:#1b2d52;
  --cyan:#00d4ff;--teal:#00b8a9;--green:#00e676;--red:#ff3d5a;--amber:#ffab00;--white:#e8eaf6;--gray:#7986cb;--gray2:#4a5568;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:#050d18;color:var(--white)}
#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--cyan),var(--teal));z-index:100;transition:width .3s}
#header{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(10,22,40,.97);border-bottom:1px solid rgba(0,212,255,.2);z-index:90}
#header .logo{font-size:13px;color:var(--cyan);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
#header .controls{display:flex;align-items:center;gap:14px}
#lang-toggle{display:flex;gap:0;border:1px solid var(--gray2);border-radius:4px;overflow:hidden;cursor:pointer}
#lang-toggle span{padding:3px 10px;font-size:11px;font-weight:700;transition:all .2s}
#lang-toggle .active{background:var(--cyan);color:var(--bg)}
#lang-toggle .inactive{color:var(--gray)}
#slide-counter{font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
#stage-wrap{position:fixed;top:44px;left:0;right:0;bottom:48px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;transform-origin:center center;background:var(--bg)}
.slide{position:absolute;top:0;left:0;width:1280px;height:720px;padding:40px 56px;display:none;overflow:hidden}
.slide.active{display:flex;flex-direction:column;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#footer{position:fixed;bottom:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:center;gap:20px;background:rgba(10,22,40,.97);border-top:1px solid rgba(0,212,255,.2);z-index:90}
#footer button{padding:6px 18px;border:1px solid var(--gray2);border-radius:4px;background:transparent;color:var(--white);cursor:pointer;font-size:12px;font-family:var(--font);transition:all .2s}
#footer button:hover{border-color:var(--cyan);color:var(--cyan)}
h1{font-size:44px;font-weight:700;line-height:1.25;margin-bottom:8px}
h2{font-size:32px;font-weight:700;color:var(--cyan);margin-bottom:14px;flex-shrink:0}
h3{font-size:22px;font-weight:600;margin-bottom:8px}
p{line-height:1.65;margin-bottom:6px;font-size:22px}
.sub{color:var(--gray);font-size:18px}
.tagline{color:var(--amber);font-size:20px;font-style:italic}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.core-msg{font-size:28px;font-weight:700;padding:18px 28px;border-left:5px solid var(--cyan);background:rgba(0,212,255,.07);margin:10px 0;border-radius:0 8px 8px 0;line-height:1.4}
.closing-msg{font-size:20px;color:var(--amber);font-style:italic;margin-top:18px;padding:14px;background:rgba(255,171,0,.08);border-radius:8px;text-align:center;line-height:1.5}
table{border-collapse:collapse;width:100%;margin:8px 0}
th,td{padding:8px 14px;text-align:left;border:1px solid rgba(0,212,255,.15);font-size:18px}
th{background:var(--bg3);color:var(--cyan);font-weight:700}
td{background:var(--bg2)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:middle}
.dot-g{background:var(--green)}.dot-r{background:var(--red)}.dot-a{background:var(--amber)}.dot-c{background:var(--cyan)}
.evidence{padding:8px 14px;border-left:4px solid var(--amber);background:rgba(255,171,0,.06);margin:4px 0;font-size:20px;border-radius:0 4px 4px 0;line-height:1.5}
.evidence strong{color:var(--amber)}
.root-cause{padding:16px;border:2px solid var(--green);background:rgba(0,230,118,.06);border-radius:8px;margin:12px 0}
.root-cause h3{color:var(--green);font-size:22px}
.plan-box{padding:18px;border:1px solid var(--cyan);background:rgba(0,212,255,.04);border-radius:8px;margin:8px 0}
.plan-row{display:flex;gap:12px;padding:5px 0;font-size:20px;line-height:1.5}
.plan-label{color:var(--cyan);font-weight:700;min-width:130px;flex-shrink:0}
.btn-approve{padding:14px 36px;border:2px solid var(--green);background:rgba(0,230,118,.12);color:var(--green);border-radius:6px;font-size:22px;font-weight:700;cursor:default;font-family:var(--font)}
.btn-reject{padding:14px 36px;border:2px solid var(--red);background:rgba(255,61,90,.12);color:var(--red);border-radius:6px;font-size:22px;font-weight:700;cursor:default;font-family:var(--font)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:8px 0}
.card{padding:14px;border:1px solid rgba(0,212,255,.15);border-radius:6px;background:var(--bg2);font-size:18px}
.card h4{color:var(--cyan);margin-bottom:6px;font-size:20px}
.code{font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-size:17px;background:var(--bg);padding:2px 8px;border-radius:3px;color:var(--cyan)}
.code-block{font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-size:17px;background:var(--bg);padding:14px;border-radius:6px;border:1px solid rgba(0,212,255,.12);overflow-x:auto;line-height:1.7}
.talk-point{padding:14px 18px;background:rgba(255,171,0,.08);border-left:5px solid var(--amber);border-radius:0 8px 8px 0;margin:14px 0;font-style:italic;font-size:20px;line-height:1.5}
.key-principle{padding:14px 18px;background:rgba(0,212,255,.08);border-left:5px solid var(--cyan);border-radius:0 8px 8px 0;margin:14px 0;font-weight:700;font-size:20px;line-height:1.5}
.status-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:20px}
.tool-badge{padding:3px 10px;border-radius:3px;font-size:15px;font-weight:700}
.tool-r{background:rgba(0,230,118,.15);color:var(--green)}.tool-w{background:rgba(255,61,90,.15);color:var(--red)}
.note{font-size:17px;color:var(--gray);font-style:italic;margin-top:8px}
.slide-content{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
svg{max-width:100%;height:auto;display:block}
.flex-row{display:flex;gap:20px;align-items:flex-start}
.flex-row>*{min-width:0}
.chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.chip{padding:10px 14px;border:1px solid rgba(0,212,255,.18);border-radius:6px;background:var(--bg2);font-size:15px;line-height:1.35}
.chip .code{font-size:14px}
.mockup{border:1px solid rgba(0,212,255,.25);border-radius:8px;overflow:hidden;background:var(--bg2)}
.mockup-header{padding:10px 18px;background:var(--bg3);border-bottom:1px solid rgba(0,212,255,.15);display:flex;justify-content:space-between;align-items:center}
.mockup-body{padding:14px}
.mockup-footer{padding:10px 18px;background:var(--bg3);border-top:1px solid rgba(0,212,255,.15)}
svg text{font-family:var(--font)}
</style>
</head>
<body>
<div id="progress"></div>
<div id="header">
  <div class="logo">HUAWEI CLOUD AI OPS</div>
  <div class="controls">
    <div id="lang-toggle" onclick="toggleLang()"><span id="lang-zh" class="active">中文</span><span id="lang-en" class="inactive">EN</span></div>

<div id="stage-wrap"><div id="stage"></div></div>
<div id="footer">

  <button onclick="next()">Next ►</button>

  });
  slides.push(function(){
    return '<div class="center" style="flex:1"><h1 style="font-size:44px;color:var(--cyan);margin-bottom:20px">'+t('s13_title')+'</h1><div style="max-width:800px"><div class="core-msg">'+t('s2_a')+'</div><div class="core-msg">'+t('s2_b')+'</div><div class="core-msg">'+t('s2_c')+'</div></div><h2 style="margin-top:28px;font-size:36px;color:var(--green)">'+t('s13_recap')+'</h2></div>';
  });
}

var cur=0;
function resizeStage(){
  var wrap=document.getElementById('stage-wrap');
  var stage=document.getElementById('stage');
  if(!wrap||!stage)return;
  var ww=wrap.clientWidth;
  var wh=wrap.clientHeight;
  var k=Math.min(ww/1280,wh/720);
  stage.style.transform='scale('+k+')';
}
function render(){
  buildSlides();
  var stage=document.getElementById('stage');
  stage.innerHTML='';
  for(var i=0;i<slides.length;i++){
    var div=document.createElement('div');
    div.className='slide'+(i===cur?' active':'');
    div.innerHTML=slides[i]();
    stage.appendChild(div);
  }
  document.getElementById('slide-counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('progress').style.width=((cur+1)/slides.length*100)+'%';
  resizeStage();
}
function next(){if(cur<slides.length-1){cur++;render()}}
function prev(){if(cur>0){cur--;render()}}
function toggleLang(){
  lang=lang==='zh'?'en':'zh';
  document.getElementById('lang-zh').className=lang==='zh'?'active':'inactive';
  document.getElementById('lang-en').className=lang==='en'?'active':'inactive';
  render();
}
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
});
var wheelLock=false;
document.addEventListener('wheel', function(e){
  if(Math.abs(e.deltaY)<8)return;
  var el=e.target;
  while(el&&el!==document.body){
    if(el.classList&&el.classList.contains('slide-content')){
      var canScroll=el.scrollHeight>el.clientHeight+2;
      if(canScroll){
        var atTop=el.scrollTop<=0;
        var atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-2;
        if((e.deltaY>0&&!atBottom)||(e.deltaY<0&&!atTop))return;
      }
      break;
    }
    el=el.parentNode;
  }
  if(wheelLock)return;
  wheelLock=true;
  setTimeout(function(){wheelLock=false;},450);
  if(e.deltaY>0){next()}else{prev()}
},{passive:true});
window.addEventListener('resize',resizeStage);
render();
</script>
</body>
